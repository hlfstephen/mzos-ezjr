# banks.conf — bank 布局的唯一事实来源
#
# 由 build.sh 与 tools/gen_farstub.py 共用：改这里一处，编译、链接、桩表、文档
# 全部跟着走。每行：<bank> <源文件...>
#
#   bank 0  $0000-$3FFF 常驻，永不切换（far 桩表也在这里）
#   bank 1  $4000-$7FFF 默认映射，零切换成本（和 bank0 一起主链接）
#   bank 2+ 可切，跨 bank 调用走桩（src/farcall.s）
#
# 规则（见 docs/12-bank-layout.md）：
#   1. 一个模块只属于一个 bank，不跨 bank 拆分；
#   2. 可切 bank 的代码不得直接引用别的 bank 的 ROM 符号（函数、常量都不行），
#      否则 call 到的是当前 bank 的字节，静默跑飞；
#   3. debug 代码固定 bank4，临时诊断用 bank7，用完清空。

0  src/main.c src/video.c src/fnt.c src/fpga.c
1  src/fat.c src/fatn.c src/fatx.c src/game.c src/savkey.c src/rtc.c
2  src/fatw.c
3  src/save.c
4  src/diag.c
5  src/font_data.c
